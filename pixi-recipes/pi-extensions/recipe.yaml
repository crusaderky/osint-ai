package:
  name: pi-extensions
  version: "1"

source:
  - path: .

build:
  number: 0
  script:
    file: build.sh
    env:
      # Single source of truth for the plugin pins, consumed by both
      # build.sh and build.bat (space-separated <package>@<version> list).
      PLUGINS: >-
        pi-llama-cpp@0.15.0
        pi-web-access@0.33.0
        pi-intercom@0.15.0
        pi-subagents@0.73.1
        pi-token-speed@0.10.1
        @juicesharp/rpiv-ask-user-question@2.11.0

requirements:
  build:
    - pi-coding-agent
    - patchelf
  run:
    - pi-coding-agent
