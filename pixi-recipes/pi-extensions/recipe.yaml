package:
  name: pi-extensions
  version: "1"

source:
  - path: .

build:
  number: 0
  script:
    file: build.sh
    env:
      # Single source of truth for the plugin pins, consumed by both
      # build.sh and build.bat (space-separated <package>@<version> list).
      PLUGINS: >-
        pi-web-access@0.40.0
        pi-intercom@0.17.0
        pi-subagents@0.78.0
        pi-token-speed@0.11.0
        @juicesharp/rpiv-ask-user-question@2.13.8

requirements:
  build:
    - pi-coding-agent
    - patchelf
  run:
    - pi-coding-agent
