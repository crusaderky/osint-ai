[workspace]
channels = ["https://prefix.dev/conda-forge"]
name = "osint-ai"
platforms = [{ name = "linux-64-glibc234", platform = "linux-64", glibc = "2.34" }]
preview = ["pixi-build"]
version = "0.1.0"

# The functional assistant works in `workspace/`; these tasks start it and
# maintain the code deployment. `osint-pi` uses the `workspace/` of this
# checkout; `osint-pi-wsl` uses the `workspace/` of the Windows checkout that
# the WSL boot helper mounts at /mnt/osint-ai. Both enter bubblewrap first.
[tasks]
install = "bash wsl/scripts/install.sh"
osint-pi = "bash wsl/scripts/launch-pi.sh native"
osint-pi-wsl = "bash wsl/scripts/launch-pi.sh wsl"
start-server = "bash wsl/scripts/launch-server.sh start"
stop-server = "bash wsl/scripts/launch-server.sh stop"
restart-server = "bash wsl/scripts/launch-server.sh restart"
update-project = "bash wsl/scripts/update-project.sh"
test = "python -m unittest discover -s tests -v"

# Tools live here and are installed by a maintainer in the project root. The
# sandbox mounts this environment read-only, so the assistant asks for a tool
# instead of installing it silently.
[dependencies]
python = "=3.14"
pip = "*"
uv = "*"
git = "*"
# Spreadsheets: Excel 97-2003 (.xls), Excel 2007+ (.xlsx) and binary sheets.
pandas = "*"
openpyxl = "*"
xlrd = "*"
pyxlsb = "*"
# Reports: Markdown to PDF, plus PDF reading. `poppler` provides pdfinfo,
# pdftotext and pdftoppm; `pandoc` and `weasyprint` are the PDF engine. A skill
# script may only use these, coreutils, or a base Linux program - a test in
# tests/test_skeleton.py enforces it, so add the package here first.
pandoc = "*"
weasyprint = "*"
poppler = "*"

[feature.pi.dependencies]
pi-coding-agent = "*"
pi-extensions = { path = "pixi-recipes/pi-extensions" }
pi-home = { path = "pixi-recipes/pi-home" }

[feature.llamacpp-binary-cuda.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-binary", flags = ["cuda"] }

[environments]
# Default environment is for skill tools, separate from Pi's running runtime.
default = ["pi"]
llamacpp-binary-cuda = { features = ["llamacpp-binary-cuda"], no-default-feature = true }
