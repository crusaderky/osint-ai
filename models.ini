version = 1

[*]
jinja = true
log-verbosity = 4
flash-attn = on

parallel = 4
kv-unified = true

# Max prompt cache in host RAM, in MiB
cache-ram = 2048
# A handful checkpoints is plenty for mid-context rollback.
ctx-checkpoints = 4

# Only show the alias
dedup-cache-models = true

# Prevent infinite loops in the inner monologue
reasoning-budget = 8192
reasoning-budget-message = "My reasoning budget is exhausted, but I have enough information to answer directly now."

[MiniCPM5-2B]
# Requires 4 GB VRAM
# It's small enough that it can (slowly) run without video acceleration
hf = bartowski/MiniCPM5-2B-GGUF:Q4_K_M
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0

temperature = 1.0
top-p = 0.95
min-p = 0.0
# Uncomment if you encounter repetitive outputs
; repeat-penalty = 1.05

[LFM2.5-230M]
# Smallest coherent model - for unit testing only
hf = LiquidAI/LFM2.5-350M-GGUF:Q4_K_M
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0

temperature = 0.1
top-k = 50
repeat-penalty = 1.05
