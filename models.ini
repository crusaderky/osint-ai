version = 1

[*]
jinja = true
log-verbosity = 4
flash-attn = on

parallel = 8
kv-unified = true

# Max prompt cache in host RAM, in MiB
cache-ram = 4096
# A handful checkpoints is plenty for mid-context rollback.
ctx-checkpoints = 4

# Only show the alias
dedup-cache-models = true

# Prevent infinite loops in the inner monologue
reasoning-budget = 8192
reasoning-budget-message = "My reasoning budget is exhausted, but I have enough information to answer directly now."

[LFM3-1.7B]
hf = Arki05/LFM3-1.7B-GGUF:5.01bpw

flash-attn = on
kv-unified = true
ctx-size = 262144
cache-type-k = q5_0
cache-type-v = q4_0

temperature = 0.1
top-k = 50
repeat-penalty = 1.1

[LFM2.5-230M]
# Smallest coherent model - for unit testing only
hf = LiquidAI/LFM2.5-350M-GGUF:Q4_K_M
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0

temperature = 0.1
top-k = 50
repeat-penalty = 1.05
